name: Update prices (free, hourly)

on:
  schedule:
    - cron: "0 3-18 * * *"   # every hour, about 8:30 AM to midnight India time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh prices only (no AI, no cost)
        run: python collect.py --prices-only
      - name: Save the new data
        run: |
          git config user.name  "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "price update" && git pull --rebase && git push)
