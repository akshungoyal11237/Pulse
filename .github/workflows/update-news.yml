name: Update news (twice a day)

on:
  schedule:
    - cron: "30 1 * * *"    # 7:00 AM India time
    - cron: "30 10 * * *"   # 4:00 PM India time (after the Indian market close)
  workflow_dispatch: {}      # lets you press "Run workflow" yourself

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect news, summaries and prices
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # free Google AI key (see README Step 4)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional paid alternative; leave unset
        run: python collect.py
      - name: Save the new data
        run: |
          git config user.name  "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "news update" && git pull --rebase && git push)
